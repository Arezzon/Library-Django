# Tool configuration only; the app is not packaged. Run both from the repo root:
#   ruff check .      (lint; `--fix` applies safe fixes)
#   black .           (format; `--check --diff` reports without writing)
# Pinned tool versions: requirements-dev.txt.

[tool.black]
line-length = 88
target-version = ["py312"]
# Migrations are generated by Django; keep them as makemigrations wrote them.
# Also ignoring hidden folders .claude and .specify.
extend-exclude = "/(migrations|\\.claude|\\.specify)/"

[tool.ruff]
line-length = 88
target-version = "py312"
# Directories whose packages count as first-party for import sorting.
src = ["library", "scripts"]
exclude = [
    "migrations",
    ".claude",
    ".specify",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
# Black owns line length and leaves long strings and comments as they are.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The seeding script must call django.setup() before importing models.
"library/seed_db.py" = ["E402"]

[tool.coverage.run]
# Run from library/, as CI does: coverage run --rcfile=/app/pyproject.toml manage.py test
relative_files = true
# Packages rather than folders, so coverage.xml names files from library/
# (author/models.py), as diff-cover needs to match them with git's paths.
source_pkgs = ["audit", "authentication", "author", "book", "events", "order", "library"]
omit = ["*/migrations/*", "*/tests.py", "*/test_*.py", "*/testing.py"]

[tool.coverage.report]
show_missing = true
