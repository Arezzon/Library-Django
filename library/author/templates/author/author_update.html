{% extends 'base.html' %}

{% block title %}Edit Author | LibrarySys{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-0 sm:px-4 py-4 sm:py-8">
    <div class="card">
        <!-- Card Header -->
        <div class="card-header">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center text-amber-700 flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                </div>
                <div class="truncate">
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 truncate">Edit Author</h1>
                    <p class="text-xs text-slate-500 truncate">{{ author.name }} {{ author.surname }}</p>
                </div>
            </div>
        </div>

        <!-- Form Body -->
        <div class="card-body">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                {% include 'includes/form_snippet.html' %}
                <div class="pt-4 border-t border-slate-100 flex flex-col-reverse sm:flex-row items-center justify-end gap-3">
                    <a href="{% url 'author_list' %}" class="btn-secondary w-full sm:w-auto justify-center">Cancel</a>
                    <button type="submit" class="btn-primary w-full sm:w-auto justify-center">Update Author</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
