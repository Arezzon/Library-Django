{% extends 'base.html' %}

{% block title %}Add Book | LibrarySys{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-0 sm:px-4 py-4 sm:py-8">
    <div class="card">
        <!-- Card Header -->
        <div class="card-header">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-100 flex items-center justify-center text-indigo-600 flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900">Add New Book</h1>
                    <p class="text-xs text-slate-500">Fill in catalog information, stock quantity, and author(s)</p>
                </div>
            </div>
        </div>

        <!-- Form Body -->
        <div class="card-body">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                {% include 'includes/form_snippet.html' %}
                <div class="pt-4 border-t border-slate-100 flex flex-col-reverse sm:flex-row items-center justify-end gap-3">
                    <a href="{% url 'book_list' %}" class="btn-secondary w-full sm:w-auto justify-center">Cancel</a>
                    <button type="submit" class="btn-primary w-full sm:w-auto justify-center">Save Book</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
