# Render Blueprint
# One-click deploy: push this repo to GitHub, then in Render click
# "New" -> "Blueprint" and select the repo. Render creates both
# the web service, Key Value queue and Postgres database from this file.
# Free demo: web and Celery share a container.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: library-django
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    dockerCommand: python /app/scripts/render_start.py
    # HTTP health check. The schema endpoint (/api/schema/) needs no auth and
    # returns 200 once gunicorn is listening. ALLOWED_HOSTS now includes
    # ".onrender.com" so Render's request is not rejected (HTTP 400). If the
    # free tier is slow to boot, raise the health-check timeout in the Render
    # dashboard (it is not settable in the Blueprint YAML).
    healthCheckPath: /api/schema/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DB_ENGINE
        value: django.db.backends.postgresql_psycopg2
      - key: DJANGO_SEED
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: library-queue
          property: connectionString
      # Database connection fields are supplied by Render.
      - key: DB_HOST
        fromDatabase:
          name: library-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: library-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: library-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: library-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: library-db
          property: database

  - type: keyvalue
    name: library-queue
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: library-db
    region: frankfurt
    databaseName: library_db
    user: library_user
    plan: free
    postgresMajorVersion: "15"
