name: Docker Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------------------
  # Lint & format: ruff and black with the settings in pyproject.toml.
  # Needs no Docker stack, so it reports style problems within seconds.
  # -------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check --output-format=github .

      - name: Check formatting with black
        run: black --check --diff .

      # FR-030: only library/book/embedding_config.py may name the embedding
      # model; everything else reads it from there (documents, and this check's
      # own pattern, excepted).
      - name: Embedding model is defined in one place
        run: |
          if git grep -n -I -E 'bge-m3|model_int8|4de13258|multilingual-e5|614241f6' -- . \
            ':!library/book/embedding_config.py' ':!*.md' ':!specs/**' \
            ':!.github/workflows/docker-build.yml'; then
            echo "::error::The embedding model is named outside library/book/embedding_config.py."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Smoke test: build the image natively on amd64 and arm64, start the
  # development stack and verify the app on each architecture.
  # Runs on every trigger (including PRs) so broken images never get pushed.
  # -------------------------------------------------------------------------
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          [
            ubuntu-latest,
            ubuntu-slim,
            ubuntu-26.04,
            ubuntu-26.04-arm,
            ubuntu-24.04,
            ubuntu-24.04-arm,
          ]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify browser tracking logic
        run: node --test scripts/test_tracking_js.cjs

      # The server stack is deployed by Portainer, not started here; check that
      # it parses. Placeholders stand in for the secrets it requires.
      - name: Validate the server stack definition
        env:
          SECRET_KEY: placeholder
          DB_PASSWORD: placeholder
        run: docker compose -f docker-compose.yml config --quiet

      # Compose has no default secrets; generate throwaway ones for this run.
      - name: Generate disposable stack secrets
        run: |
          for name in SECRET_KEY DB_PASSWORD; do
            value=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image for this architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: library-django:dev
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}

      - name: Start the development stack and wait for health
        env:
          DJANGO_SEED: "true"
        run: docker compose -f docker-compose-dev.yml up -d --wait --no-build

      # Without a SECRET_KEY from the runtime environment Django must refuse
      # to start; this also fails if the image bakes in a default key.
      - name: Verify the image ships no default SECRET_KEY
        run: |
          image=$(docker inspect --format '{{.Image}}' "$(docker compose -f docker-compose-dev.yml ps -q web)")
          docker run --rm --entrypoint python "$image" -c 'import library.settings' 2>&1 \
            | grep 'ImproperlyConfigured: SECRET_KEY'

      # The development source bind mount hides staticfiles collected in the image.
      - name: Collect static files for the mounted source
        run: docker compose -f docker-compose-dev.yml exec -T web python manage.py collectstatic --noinput

      - name: Run Django regression tests against PostgreSQL
        run: docker compose -f docker-compose-dev.yml exec -T -e RUN_BOOK_EMBEDDING_MODEL_TESTS=1 -e CELERY_TASK_ALWAYS_EAGER=True web python manage.py test authentication author book order events --verbosity 2

      - name: Wait for the web server to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/schema/ >/dev/null; then
              echo "App is up after ${i}s"
              break
            fi
            echo "  waiting for app... (${i}s)"
            sleep 1
          done

      - name: Verify key endpoints respond
        run: |
          echo "== /api/docs/ =="
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8000/api/docs/
          echo "== /api/schema/ =="
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8000/api/schema/
          echo "== /api/v1/version/ (must report this commit) =="
          curl -fsS http://localhost:8000/api/v1/version/ | grep "${{ github.sha }}"
          echo "== semantic search =="
          curl -fsS "http://localhost:8000/api/v1/books/search/?q=detective"
          echo "== /api/v1/ (API root) =="
          curl -fsS http://localhost:8000/api/v1/

      - name: Verify real asynchronous event tracking
        run: docker compose -f docker-compose-dev.yml exec -T web python manage.py smoke_test_tracking

      - name: Verify event queue survives worker and broker restart
        run: python scripts/smoke_tracking_recovery.py --compose-file docker-compose-dev.yml

      # The whole stack must fit the Raspberry Pi budget; memory does not depend
      # on the CPU, so CI enforces it. Latency is measured on the Pi itself.
      - name: Verify the stack stays within the 4 GiB memory budget
        run: python scripts/smoke_stack_budget.py --compose-file docker-compose-dev.yml --max-memory-gib 4

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-dev.yml down -v

  # -------------------------------------------------------------------------
  # Publish: build each architecture on its own native runner and push it to
  # GHCR by digest only (no tags yet). Only after lint and both smoke tests
  # pass, and only for pushes to main and version tags (never pull requests).
  # -------------------------------------------------------------------------
  publish:
    needs: [lint, smoke-test]
    if: github.event_name == 'push'
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # needed to push to GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR image names must be lowercase; the repository name is not.
      - name: Resolve the image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # Merge: combine both digests into one multi-architecture manifest and tag
  # it. `main` only moves forward in main's history: a build whose commit does
  # not descend from the one under `main` (an older run finishing late) gets
  # its sha- tag only and does not deploy. Serialized per ref, so overlapping
  # runs never interleave tag writes.
  # -------------------------------------------------------------------------
  merge:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # needed to push to GHCR
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      tags: ${{ steps.summary.outputs.tags }}
    steps:
      # Full history, for the ancestor check below.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Resolve the image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether main may move
        id: decide
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            # Version tags never touch main; the redeploy keeps the Pi on its reference.
            echo "move_main=false" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(docker buildx imagetools inspect "${IMAGE}:main" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '."linux/amd64".config.Labels["org.opencontainers.image.revision"] // empty' || true)
          status=0
          if [ -n "$current" ]; then
            git merge-base --is-ancestor "$current" "$GITHUB_SHA" || status=$?
          fi
          if [ "$status" -eq 1 ]; then
            echo "::notice::A newer commit already moved main; this build was published as sha-${GITHUB_SHA::7} only."
            echo "move_main=false" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            # The commit under main is not in this history (for example after a force push).
            echo "::warning::main pointed at ${current}, which is not in main's history; moving main to ${GITHUB_SHA}."
          fi
          echo "move_main=true" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ steps.decide.outputs.move_main == 'true' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Create the multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do
            [ -n "$tag" ] && tags+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          digests=()
          for digest in *; do
            digests+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"

      - name: Verify both architectures are published
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          platforms=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')
          echo "$platforms"
          grep -qx linux/amd64 <<< "$platforms"
          grep -qx linux/arm64 <<< "$platforms"

      - name: Summarize the published tags
        id: summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          list=""
          while read -r tag; do
            [ -n "$tag" ] && list="${list:+$list, }${tag##*:}"
          done <<< "$TAGS"
          echo "tags=$list" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Deploy: call the Portainer stack webhook so the server pulls the new
  # images and redeploys. Runs in the `production` environment (main and v*
  # only), the only place the webhook URL exists, so pull-request runs can
  # never read it. The URL is never printed, and TLS is always verified.
  # -------------------------------------------------------------------------
  deploy:
    needs: merge
    if: needs.merge.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    # One group for every ref: there is one server and one webhook, so a main
    # push and a version tag on it must not redeploy the stack at the same
    # time. A newer pending deploy may replace an older one: the webhook always
    # redeploys whatever the stack follows, so the last one is enough.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Full history, so the confirmation accepts a newer commit on main.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger the Portainer redeploy
        id: trigger
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          TAGS: ${{ needs.merge.outputs.tags }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "::warning::Images ${TAGS} published; server deployment skipped because PORTAINER_WEBHOOK_URL is not configured."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 300 \
            --request POST "$PORTAINER_WEBHOOK_URL" 2>/dev/null) || status=$?
          case "$code" in
            2??)
              echo "Redeploy triggered for ${TAGS} (HTTP ${code})."
              echo "triggered=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Images ${TAGS} were published, but the server was not redeployed (HTTP ${code:-000} / curl exit ${status})."
              exit 1
              ;;
          esac

      # FR-036: a redeploy that fails after the trigger (pull error, unhealthy
      # new version, pinned stack) must not stay silent. Wait up to 15 minutes
      # for the site to report this commit or a newer one.
      - name: Confirm the site runs the new version
        id: confirm
        if: steps.trigger.outputs.triggered == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TAGS: ${{ needs.merge.outputs.tags }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::Redeploy not confirmed: SITE_URL is not configured for the production environment."
            exit 0
          fi
          deadline=$((SECONDS + ${CONFIRM_TIMEOUT:-900}))
          reported=""
          while :; do
            body=$(curl --silent --max-time 10 "${SITE_URL%/}/api/v1/version/" 2>/dev/null || true)
            reported=$(jq -r '.commit // empty' <<< "$body" 2>/dev/null || true)
            if [ -n "$reported" ] && { [ "$reported" = "$GITHUB_SHA" ] \
              || git merge-base --is-ancestor "$GITHUB_SHA" "$reported" 2>/dev/null; }; then
              echo "Redeploy confirmed: the site runs ${reported}."
              exit 0
            fi
            [ "$SECONDS" -ge "$deadline" ] && break
            sleep "${CONFIRM_INTERVAL:-15}"
          done
          echo "::error::Redeploy for ${TAGS} was triggered but not confirmed: the site reports ${reported:-no response}. The stack may be pinned, unhealthy or still starting."
          exit 1
