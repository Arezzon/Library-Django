# Server stack for the Django Library app: deployed by Portainer Business
# Edition as a Git repository stack (see docs/deployment/raspberry-pi-portainer.md).
# Services: web (Django + gunicorn), worker (Celery), db (PostgreSQL), redis.
#
# It runs published multi-architecture images only (linux/amd64, linux/arm64):
# nothing is built on the server and no source is mounted. Every setting comes
# from the stack environment; local development uses docker-compose-dev.yml.
#
# Without Portainer, on any amd64 or arm64 host:
#   SECRET_KEY=... DB_PASSWORD=... docker compose -f docker-compose.yml up -d

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-library_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Portainer stack environment}
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redisdata8:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    # IMAGE_TAG=main follows the newest main build; sha-<short> or <version> pins one.
    image: ${IMAGE_REPOSITORY:-ghcr.io/arezzon/library-django}:${IMAGE_TAG:-main}
    restart: unless-stopped
    # Secrets have no defaults: the deployment stops and names the missing one.
    # The embedding model ships inside the image; never add BOOK_EMBEDDING_MODEL*
    # here (a value that differs from the image stops web with the book.E001 check).
    environment: &app_environment
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the Portainer stack environment}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-False}
      DB_ENGINE: django.db.backends.postgresql_psycopg2
      DB_NAME: ${DB_NAME:-library_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Portainer stack environment}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      # Demo data has publicly documented passwords; off unless the operator opts in.
      DJANGO_SEED: ${DJANGO_SEED:-false}
      # Gunicorn workers (each holds one model copy) and inference threads per worker.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      BOOK_EMBEDDING_THREADS: ${BOOK_EMBEDDING_THREADS:-2}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy only once Django serves requests; the start period covers
    # re-encoding every book after an embedding model change.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/version/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
      start_interval: 5s

  worker:
    image: ${IMAGE_REPOSITORY:-ghcr.io/arezzon/library-django}:${IMAGE_TAG:-main}
    restart: unless-stopped
    # Web owns migrations, seeding and re-encoding; the worker only runs queued events.
    entrypoint: ["celery"]
    command: ["-A", "library", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=events"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

# New volumes for PostgreSQL 18 and Redis 8: the upgraded services start on empty
# data (PostgreSQL 18 cannot read 15 data files). See the operator guide,
# "Upgrade to PostgreSQL 18 and Redis 8 (one-time reset)".
volumes:
  pgdata18:
  redisdata8:
