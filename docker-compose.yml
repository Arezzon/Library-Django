# Docker Compose for the Django Library app
# Services: web (Django + gunicorn/runserver) and db (PostgreSQL)
# Usage:
#   docker compose up --build          # build & run
#   docker compose up --build -d       # run detached
#   docker compose down               # stop & remove
#   docker compose down -v            # also remove the DB volume

services:
  db:
    image: pgvector/pgvector:0.8.2-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-library_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # The Django settings read these env vars directly.
    environment: &app_environment
      CELERY_BROKER_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DB_ENGINE: django.db.backends.postgresql_psycopg2
      DB_NAME: ${DB_NAME:-library_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SEED: ${DJANGO_SEED:-true}
      BOOK_EMBEDDING_CACHE_DIR: /app/.cache/book-embeddings
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      # Mount app source for live reload when using runserver.
      # Comment out to use the code baked into the image.
      - ./library:/app/library
      - embedding_cache:/app/.cache/book-embeddings

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Web owns migrations/seeding; the worker executes only committed tasks.
    entrypoint: ["celery"]
    command: ["-A", "library", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=events"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./library:/app/library

volumes:
  pgdata:
  embedding_cache:
  redisdata:
