# Server stack for the Django Library app: deployed by Portainer Business
# Edition as a Git repository stack (see docs/deployment/raspberry-pi-portainer.md).
# Services: web (Django + gunicorn), worker (Celery), db (PostgreSQL), redis,
# backup (a daily, checked database backup into its own volume).
#
# It runs published multi-architecture images only (linux/amd64, linux/arm64):
# nothing is built on the server and no source is mounted. Every setting comes
# from the stack environment; local development uses docker-compose-dev.yml.
#
# Without Portainer, on any amd64 or arm64 host:
#   SECRET_KEY=... DB_PASSWORD=... docker compose -f docker-compose.yml up -d

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-library_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Portainer stack environment}
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redisdata8:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    # IMAGE_TAG=main follows the newest main build; sha-<short> or <version> pins one.
    image: ${IMAGE_REPOSITORY:-ghcr.io/arezzon/library-django}:${IMAGE_TAG:-main}
    restart: unless-stopped
    # Secrets have no defaults: the deployment stops and names the missing one.
    # The embedding model ships inside the image; never add BOOK_EMBEDDING_MODEL*
    # here (a value that differs from the image stops web with the book.E001 check).
    environment: &app_environment
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the Portainer stack environment}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-False}
      DB_ENGINE: django.db.backends.postgresql_psycopg2
      DB_NAME: ${DB_NAME:-library_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Portainer stack environment}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      # Demo data has publicly documented passwords; off unless the operator opts in.
      DJANGO_SEED: ${DJANGO_SEED:-false}
      # Gunicorn workers (each holds one model copy) and inference threads per worker.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      BOOK_EMBEDDING_THREADS: ${BOOK_EMBEDDING_THREADS:-2}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy only once Django serves requests; the start period covers
    # re-encoding every book after an embedding model change.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/version/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
      start_interval: 5s

  worker:
    image: ${IMAGE_REPOSITORY:-ghcr.io/arezzon/library-django}:${IMAGE_TAG:-main}
    restart: unless-stopped
    # Web owns migrations, seeding and re-encoding; the worker only runs queued events.
    entrypoint: ["celery"]
    command: ["-A", "library", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=events"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Daily backups of the database into the pgbackups volume (operator guide, "Daily
  # backups"). The database image carries the matching pg_dump. Keep this service
  # identical in docker-compose-dev.yml; a test compares them.
  backup:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-library_db}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Portainer stack environment}
      # The UTC hour at or after which each day's backup runs (1 is 03:00 or 04:00
      # in Kyiv), and the days backups are kept; the 7 newest always stay.
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - pgbackups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Installs library-backup, then runs it. "loop" checks every 10 minutes and takes
    # the day's backup; `library-backup once` takes one now. $$ is a literal $.
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /usr/local/bin/library-backup <<'SCRIPT'
        #!/bin/sh
        # library-backup once|loop: pg_dump the database into /backups, read the
        # whole archive back, write its checksum, then prune old backups.
        set -u
        dir=/backups
        retry=""
        log() {
          printf '%s %s backup - backup: %s\n' "$$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" "$$1" "$$2"
        }
        hour=$${BACKUP_HOUR:-1}
        keep_days=$${BACKUP_KEEP_DAYS:-7}
        for value in "$$hour" "$$keep_days"; do
          case "$$value" in
            ''|*[!0-9]*)
              log ERROR "BACKUP_HOUR and BACKUP_KEEP_DAYS must be whole numbers, not '$$hour' and '$$keep_days'; no backups are taken"
              exit 2
              ;;
          esac
        done
        if [ "$$hour" -gt 23 ]; then
          log ERROR "BACKUP_HOUR must be 0 to 23, not $$hour; no backups are taken"
          exit 2
        fi
        once() {
          umask 077
          name=library-$$(date -u +%Y%m%dT%H%M%SZ).dump
          partial="$$dir/$$name.partial"
          started=$$(date +%s.%N)
          fail() {
            rm -f "$$partial" "$$dir/$$name.sha256"
            message=$$(printf '%s' "$$2" | tr -s '\n\t' '  ')
            log ERROR "failed at $$1: $$message; earlier backups kept$$retry"
            exit 1
          }
          if ! output=$$(pg_dump --format=custom --file="$$partial" 2>&1); then
            fail pg_dump "$$output"
          fi
          if ! output=$$(pg_restore --list "$$partial" 2>&1 >/dev/null); then
            fail check "$$output"
          fi
          if ! output=$$(pg_restore --file=/dev/null "$$partial" 2>&1); then
            fail check "$$output"
          fi
          hash=$$(sha256sum < "$$partial" | cut -d ' ' -f 1)
          [ -n "$$hash" ] || fail checksum "sha256sum produced no checksum"
          printf '%s  %s\n' "$$hash" "$$name" > "$$dir/$$name.sha256" \
            || fail checksum "could not write $$name.sha256"
          mv "$$partial" "$$dir/$$name" || fail rename "could not rename $$name.partial"
          kept=0
          removed=0
          for file in $$(ls -1t "$$dir"/library-*.dump 2>/dev/null); do
            if [ "$$kept" -ge 7 ] && [ -n "$$(find "$$file" -mtime +"$$keep_days")" ]; then
              rm -f "$$file" "$$file.sha256"
              removed=$$((removed + 1))
            else
              kept=$$((kept + 1))
            fi
          done
          size=$$(stat -c %s "$$dir/$$name")
          size=$$(awk -v bytes="$$size" 'BEGIN { printf "%.1f MB", bytes / 1000000 }')
          took=$$(awk -v start="$$started" -v end="$$(date +%s.%N)" 'BEGIN { printf "%.1f", end - start }')
          log INFO "created $$name ($$size) in $$took s; check passed; $$kept kept, $$removed removed"
        }
        case "$${1:-loop}" in
          once)
            once
            ;;
          loop)
            retry="; next try in 10 minutes"
            while :; do
              if [ "$$(date -u +%H)" -ge "$$hour" ] \
                && ! ls "$$dir"/library-"$$(date -u +%Y%m%d)"T*.dump >/dev/null 2>&1; then
                (once) || true
              fi
              sleep 600
            done
            ;;
          *)
            echo "usage: library-backup once|loop" >&2
            exit 2
            ;;
        esac
        SCRIPT
        chmod 755 /usr/local/bin/library-backup
        exec library-backup "$$@"
      - library-backup
    command: ["loop"]

# New volumes for PostgreSQL 18 and Redis 8: the upgraded services start on empty
# data (PostgreSQL 18 cannot read 15 data files). See the operator guide,
# "Upgrade to PostgreSQL 18 and Redis 8 (one-time reset)". Backups live in a
# volume of their own, so recreating pgdata18 leaves them intact.
volumes:
  pgdata18:
  redisdata8:
  pgbackups:
